vqgan_ckpt: 
default_root_dir: /home/sr2369/inpainting
voxel_dir: max_area_2.5d_voxel

# Have to be derived from VQ-GAN Latent space dimensions
diffusion_img_size: 128
diffusion_depth_size: 9
diffusion_num_channels: 1
init_dim: 96
dim_mults: [1, 1, 2, 2, 4, 8]
attn_heads: 4
init_kernel_size: 7
# dim_mults: ???
results_folder: /home/sr2369/cspca/ddpm_results
results_folder_postfix: ddpm_results_07_10_25
load_milestone:
load_milestone_path: /home/sr2369/inpainting/ddpm_results/ddpm_results_07_10_25
# load_milestone: False

batch_size: 5
num_workers: 8
logger: wandb
objective: pred_x0
save_and_sample_every: 500
denoising_fn: Unet3D
train_lr: 1e-5
timesteps: 300 # number of steps
sampling_timesteps: 250 # number of sampling timesteps (using ddim for faster inference [see citation for ddim paper])
loss_type: l1 # L1 or L2
train_num_steps: 700000 # total training steps
gradient_accumulate_every: 1 # gradient accumulation steps
ema_decay: 0.999 # exponential moving average decay
amp: False # turn on mixed precision
num_sample_rows: 1
gpus: 1

cond_dim: 64
num_features: 1
normalize: True
